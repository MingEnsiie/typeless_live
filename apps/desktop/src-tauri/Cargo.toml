[package]
name = "typeless-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "typeless_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "typeless-desktop"
path = "src/main.rs"

[features]
default = []
whisper = ["typeless-asr/whisper"]

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
parking_lot = "0.12"

typeless-core = { path = "../../../crates/typeless-core" }
typeless-storage = { path = "../../../crates/typeless-storage" }
typeless-audio = { path = "../../../crates/typeless-audio" }
typeless-asr = { path = "../../../crates/typeless-asr" }
typeless-llm = { path = "../../../crates/typeless-llm" }
typeless-inject = { path = "../../../crates/typeless-inject" }
typeless-hotkey = { path = "../../../crates/typeless-hotkey" }
typeless-context = { path = "../../../crates/typeless-context" }

[build-dependencies]
tauri-build = { version = "2.0" }
