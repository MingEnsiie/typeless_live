[package]
name = "typeless-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typeless - AI 语音输入法守护进程 (CLI)"
repository = "https://github.com/MingEnsiie/typeless_live"

[package.metadata.deb]
maintainer = "Typeless Contributors"
copyright = "2025, Typeless Contributors"
extended-description = "Wispr Flow 风格的 AI 语音输入法。本地 Whisper + 云端 / 本地 LLM 后处理，支持热键唤起、SQLite 历史、词典、隐私模式。"
depends = "$auto, libasound2, libxdo3, libxcb1, libxkbcommon0"
section = "utility"
priority = "optional"
assets = [
    ["target/release/typeless-cli", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/typeless/README.md", "644"],
    ["../../packaging/systemd/typeless.service", "usr/lib/systemd/user/typeless.service", "644"],
    ["../../scripts/download-models.sh", "usr/share/typeless/download-models.sh", "755"],
]

[[bin]]
name = "typeless-cli"
path = "src/main.rs"

[features]
default = []
whisper = ["typeless-asr/whisper"]

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
toml = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tracing-appender = "0.2"
axum = { workspace = true }
async-stream = { workspace = true }
tower-http = { workspace = true }

typeless-core = { path = "../typeless-core" }
typeless-storage = { path = "../typeless-storage" }
typeless-audio = { path = "../typeless-audio" }
typeless-asr = { path = "../typeless-asr" }
typeless-llm = { path = "../typeless-llm" }
typeless-inject = { path = "../typeless-inject" }
typeless-hotkey = { path = "../typeless-hotkey" }
typeless-context = { path = "../typeless-context" }
